[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datamine"
version = "0.1.0"
description = "AV perception data pipeline: PySpark extraction, CLIP-based sample selection, PyArrow storage on S3"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyspark>=3.5",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
clip = ["open_clip_torch>=2.24", "torch>=2.1", "pillow>=10.0"]
faiss = ["faiss-cpu>=1.7.4"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=7.4", "pandas>=2.0"]

[project.scripts]
datamine = "datamine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
